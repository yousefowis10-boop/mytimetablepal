name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DEBUG: "True"
      ROUTING_PROVIDER_OVERRIDE: haversine
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements.txt
      - run: python manage.py makemigrations --check --dry-run
      - name: Every server message has an Arabic translation
        run: python scripts/i18n.py check
      - name: Unit, permission, isolation and solver tests
        run: python manage.py test api ops transport
      - name: Solver benchmark (demo-sized school)
        run: python manage.py benchmark_solver --sizes 30x55 --time-limit 30

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - name: Every on-screen string has an Arabic translation
        run: node scripts/i18n-check.mjs
      - name: Smoke tests
        run: npm test
      - run: npm run build
        env:
          VITE_API_URL: https://example.invalid/api
